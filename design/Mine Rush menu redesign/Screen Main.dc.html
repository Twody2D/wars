<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#141847}a{color:#8FCBFF}a:hover{color:#fff}</style>
</helmet>

    <img src="kit/icon_plus.svg" style="position:absolute;left:228px;top:2px;width:62px;height:62px;">

    </div>
    <div style="position:absolute;left:284px;top:26px;width:232px;height:102px;">
      <img src="kit/tab_inactive.svg" style="position:absolute;left:0;top:0;width:232px;height:102px;">
      <img src="kit/icon_up.svg" style="position:absolute;left:92px;top:5px;width:48px;height:48px;">

    <div style="position:absolute;left:528px;top:26px;width:232px;height:102px;">

    </div>
  </div>
  </sc-if>
  <sc-if value="{{ tabs4 }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:50%;bottom:0;width:900px;height:130px;margin-left:-450px;">
      <dc-import name="Tab Bar" active="battle" shop-dot="{{ true }}" up-dot="{{ true }}" hint-size="900px,130px" style="position:absolute;left:0;top:0;width:900px;height:130px;"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;boss&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tabs4&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const boss = !!this.props.boss, tabs4 = !!this.props.tabs4;
    return {
      boss, normal: !boss, tabs4, tabs3: !tabs4,
      ch: {
        zombie: 'assets/zombie_blue.png', zombieRed: 'assets/zombie_red.png',
        archer: 'assets/skeleton_red.png', archerBlue: 'assets/skeleton_blue.png',
        logo: 'assets/art_logo.png'
      }
    };
  }
}
</script>
</body>
</html>
